name: Asanchez — еженедельный скан дублей

on:
  schedule:
    # 08:00 UTC воскресенье ≈ 09:00 (зима) / 10:00 (лето, DST) по Europe/Madrid
    - cron: "0 8 * * 0"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Проверить проекты Gestión Operativa на дубли
        run: npm run weekly-scan
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          REPORT_PROJECT_GID: ${{ secrets.REPORT_PROJECT_GID }}
